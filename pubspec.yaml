name: flutter_timeago_pro
description: >
  Formats DateTime into human-friendly timestamps like "Just now", "5m ago", "Monday", or "12 Jan 2024" automatically based on how far past or future the DateTime is.
version: 3.0.2
homepage: https://github.com/aslamambiloly/flutter_timeago_pro
issue_tracker: https://github.com/aslamambiloly/flutter_timeago_pro/issues
screenshots:
  - description: 'Sample formatted time used in a real world scenario'
    path: doc/cover.png

topics:
  - datetime
  - formatting
  - localization
  - utilities
  - text
  
environment:
  sdk: '>=3.0.2 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
